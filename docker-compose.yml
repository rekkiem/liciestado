version: "3.9"

# ── LiciEstado — docker-compose.yml ──────────────────────────────────────────
# Uso:
#   docker compose up -d                 # Postgres (default) + app
#   docker compose --profile sqlite up -d  # App con SQLite (sin servicio db)
#
# Copiar .env.example → .env y completar FERNET_KEY / SECRET_KEY antes de iniciar.

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: liciestado_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mp_user:mp_pass@db:5432/mp_alertas}
      TZ: America/Santiago

    ports:
      - "${PORT:-5000}:5000"

    volumes:
      - app_data:/data
      - app_logs:/app/logs

    depends_on:
      db:
        condition: service_healthy
        required: false

    healthcheck:
      test: ["CMD", "curl", "-f", "-u",
             "${DASHBOARD_USER:-admin}:${DASHBOARD_PASS:-admin}",
             "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: liciestado_db
    restart: unless-stopped

    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mp_alertas}
      POSTGRES_USER:     ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp_pass}

    volumes:
      - pg_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mp_user} -d ${POSTGRES_DB:-mp_alertas}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # SQLite-only app (sin servicio db). Útil en dev local sin Docker DB.
  app_sqlite:
    profiles: ["sqlite"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: liciestado_app_sqlite
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mercadopublico.db}
      TZ: America/Santiago
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - app_data:/data
      - app_logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: liciestado_nginx
    restart: unless-stopped
    profiles: ["nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  pg_data:
  app_data:
  app_logs:
